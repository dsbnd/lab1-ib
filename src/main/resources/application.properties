spring.application.name=secure-rest-api
spring.datasource.url=jdbc:h2:file:./data/secure-api
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=secure-rest-api
security.jwt.ttl-minutes=30
app.initial-admin-username=${INITIAL_ADMIN_USERNAME:student}
app.initial-admin-password=${INITIAL_ADMIN_PASSWORD:}

server.error.include-message=never
server.error.include-stacktrace=never

