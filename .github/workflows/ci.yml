name: Security CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Run SAST with SpotBugs
        run: mvn -B compile spotbugs:spotbugs spotbugs:check

      - name: Generate Trivy SCA report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: target/trivy-report.json
          exit-code: "0"

      - name: Fail on high or critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            target/spotbugsXml.xml
            target/trivy-report.json
          if-no-files-found: warn
